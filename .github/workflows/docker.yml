name: Publish Docker image

# Builds the image and pushes it to GitHub Container Registry (ghcr.io).
# Runs when you publish a GitHub Release (tagged like v0.1.3) or manually.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # Repo, PyPI package, and GHCR image all share the name `md-to-pdf-cli`, so
  # `docker pull` matches `pip install`. Pinned explicitly and lowercased (ghcr.io
  # requires lowercase) rather than `${{ github.repository }}`, which carries the
  # owner's original casing. The OCI source label metadata-action adds still links
  # the image back to the repo.
  IMAGE: ghcr.io/suyw-0123/md-to-pdf-cli

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
